<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>World Geography Trainer</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22GeoTrainer%22,%22short_name%22:%22GeoTrainer%22,%22display%22:%22standalone%22,%22start_url%22:%22.%22,%22background_color%22:%22%230b1120%22,%22theme_color%22:%22%230b1120%22}">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<style>
  :root {
    --bg: #0b1120;
    --card: #1e293b;
    --border: #334155;
    --accent: #38bdf8;
    --success: #22c55e;
    --danger: #ef4444;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --card-hint: #1e1b4b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.05rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .scope-select { background: #0f172a; color: var(--accent); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; outline: none; }
  .tabs { display: flex; gap: 6px; }
  .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
  .tab-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  main { display: flex; flex: 1; overflow: hidden; }
  #map-container { flex: 1; position: relative; background: #060913; }
  svg { width: 100%; height: 100%; cursor: grab; }
  svg:active { cursor: grabbing; }
  .country { fill: #1e293b; stroke: #0b1120; stroke-width: 0.5px; transition: fill 0.2s, opacity 0.2s; }
  .country:hover { fill: #0284c7; }
  .country.dimmed { opacity: 0.18; fill: #141c2e; pointer-events: none; }
  .country.correct { fill: var(--success) !important; }
  .country.wrong { fill: var(--danger) !important; }
  #sidebar { width: 360px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 16px; gap: 14px; }
  .panel { display: none; flex-direction: column; gap: 12px; }
  .panel.active { display: flex; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
  .stat-val { font-size: 1.15rem; font-weight: 700; color: var(--accent); }
  .stat-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; }
  .flag-img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .info-box { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.88rem; }
  .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .info-row:last-child { margin-bottom: 0; }
  .hint-card { background: var(--card-hint); border: 1px solid #4338ca; border-radius: 6px; padding: 12px; font-size: 0.83rem; line-height: 1.4; color: #c7d2fe; display: none; }
  .hint-btn { background: transparent; border: 1px dashed var(--accent); color: var(--accent); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; text-align: center; }
  .options-grid { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn { background: #182234; border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 0.85rem; }
  .opt-btn:hover { background: #26354f; }
  .opt-btn.correct { background: var(--success) !important; }
  .opt-btn.wrong { background: var(--danger) !important; }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #sidebar { width: 100%; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>World Geo Trainer</h1>
    <select id="scope-selector" class="scope-select" onchange="onScopeChange(this.value)">
      <option value="193">193: UN Members</option>
      <option value="195" selected>195: Sovereign States</option>
      <option value="200">200: De Facto / Disputed</option>
      <option value="245">245: All World Territories</option>
    </select>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchMode('explore')">Explore</button>
    <button class="tab-btn" onclick="switchMode('capitals')">Capitals</button>
    <button class="tab-btn" onclick="switchMode('flags')">Flags</button>
    <button class="tab-btn" onclick="switchMode('map')">Find on Map</button>
  </div>
</header>

<main>
  <div id="map-container">
    <svg id="world-map"></svg>
  </div>
  <aside id="sidebar">
    <!-- Explore Panel -->
    <div id="explore-panel" class="panel active">
      <h2 style="font-size: 1rem;">Country Explorer</h2>
      <p style="font-size: 0.78rem; color: var(--text-muted);">Tap any active country on the map to inspect its data and AI mnemonic.</p>
      <img id="explore-flag" class="flag-img" style="display:none;" />
      <div id="explore-info" class="info-box" style="display:none;">
        <div class="info-row"><span style="color:var(--text-muted)">Country:</span><strong id="explore-name">-</strong></div>
        <div class="info-row"><span style="color:var(--text-muted)">Capital:</span><strong id="explore-capital">-</strong></div>
        <div class="info-row"><span style="color:var(--text-muted)">Region:</span><span id="explore-region">-</span></div>
        <div class="info-row"><span style="color:var(--text-muted)">Classification:</span><span id="explore-tier">-</span></div>
      </div>
      <div id="explore-mnemonic-box" class="hint-card">
        <strong style="color: #e0e7ff; display:block; margin-bottom: 4px;">🧠 Capital Mnemonic:</strong>
        <span id="explore-mnemonic">-</span>
        <strong style="color: #e0e7ff; display:block; margin: 8px 0 4px;">💡 Visual Clue:</strong>
        <span id="explore-fact">-</span>
      </div>
    </div>

    <!-- Quiz Panel -->
    <div id="quiz-panel" class="panel">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-val" id="score-streak">0</div><div class="stat-lbl">Streak</div></div>
        <div class="stat-card"><div class="stat-val" id="score-mastered">0</div><div class="stat-lbl">Mastered</div></div>
        <div class="stat-card"><div class="stat-val" id="score-acc">0%</div><div class="stat-lbl">Accuracy</div></div>
      </div>

      <img id="quiz-flag" class="flag-img" style="display:none;" />
      <div id="quiz-question" style="font-size: 0.95rem; font-weight: 600; text-align: center;">-</div>
      <div class="options-grid" id="quiz-options"></div>

      <button id="hint-trigger" class="hint-btn" onclick="revealHint()">💡 Need an AI Mnemonic Clue?</button>
      <div id="quiz-hint-box" class="hint-card">
        <span id="quiz-hint-text">-</span>
      </div>
    </div>
  </aside>
</main>

<script>
const allCountries = [{"code": "AF", "cca3": "AFG", "name": "Afghanistan", "capital": "Kabul", "region": "Asia", "subregion": "Southern Asia", "flag": "https://flagcdn.com/af.svg", "mnemonic": "You need a strong cable (Kabul) to pull a vehicle up the rugged mountains of Afghanistan.", "visual_fact": "Afghanistan's flag features a central emblem depicting a mosque surrounded by a sheaf of wheat.", "tier": 193}, {"code": "AL", "cca3": "ALB", "name": "Albania", "capital": "Tirana", "region": "Europe", "subregion": "Southeast Europe", "flag": "https://flagcdn.com/al.svg", "mnemonic": "Picture the Queen of Albania wearing a grand tiara (Tirana) while greeting her people.", "visual_fact": "Albania's flag is striking and easily recognized by its bold black double-headed eagle on a stark red background.", "tier": 193}, {"code": "DZ", "cca3": "DZA", "name": "Algeria", "capital": "Algiers", "region": "Africa", "subregion": "Northern Africa", "flag": "https://flagcdn.com/dz.svg", "mnemonic": "Remembering Algeria's capital is effortless because Algiers sounds almost identical to the country name.", "visual_fact": "Algeria's flag is split vertically into green and white sections, centered with a red crescent and star.", "tier": 193}, {"code": "AS", "cca3": "ASM", "name": "American Samoa", "capital": "Pago Pago", "region": "Oceania", "subregion": "Polynesia", "flag": "https://flagcdn.com/as.svg", "mnemonic": "In American Samoa, you have to pay as you go\u2014Pago Pago\u2014to explore the islands.", "visual_fact": "The flag of American Samoa prominently features an American bald eagle holding traditional Samoan symbols of power.", "tier": 193}, {"code": "AD", "cca3": "AND", "name": "Andorra", "capital": "Andorra la Vella", "region": "Europe", "subregion": "Southern Europe", "flag": "https://flagcdn.com/ad.svg", "mnemonic": "Andorra keeps it simple by naming its capital Andorra la Vella, meaning 'Andorra the Old'.", "visual_fact": "Nestled entirely within the Pyrenees mountains, An a) and re-enlists every year again (Yerevan).", "visual_fact": "Armenia's flag is a simple horizontal tricolor of red, blue, and a warm shade of orange representing the country's courage and fertile lands.", "tier": 193}, {"code": "AW", "cca3": "ABW", "name": "Aruba", "capital": "Oranjestad", "region": "Americas", "subregion": "Caribbean", "flag": "https://flagcdn.com/aw.svg", "mnemonic": "A scuba diver in Aruba loved drinking orange soda in Oranjestad.", "visual_fact": "Aruba's flag features a red four-pointed star representing its four main languages and its location in the blue Caribbean Sea.", "tier": 193}, {"code": "AU", "cca3": "AUS", "name": "Australia", "capital": "Canberra", "region": "Oceania", "subregion": "Australia and New Zealand", "flag": "https://flagcdn.com/au.svg", "mnemonic": "In Australia, you can buy a fresh can of berries in Canberra.", "visual_fact": "Australia's flag displays the Southern Cross constellation alongside a large seven-pointed Commonwealth Star.", "tier": 193}, {"code": "AT", "cca3": "AUT", "name": "Austria", "capital": "Vienna", "region": "Europe", "subregion": "Central Europe", "flag": "https://flagcdn.com/at.svg", "mnemonic": "In Austria, we end up listening to classical music in Vienna.", "visual_fact": "The historic red-white-red horizontal stripes of Austria's flag are said to represent Duke Leopold V's blood-stained tunic.", "tier": 193}, {"code": "AZ", "cca3": "AZE", "name": "Azerbaijan", "capital": "Baku", "region": "Asia", "subregion": "Western Asia", "flag": "https://flagcdn.com/az.svg", "mnemonic": "The traveler in Azerbaijan took a bus back to Baku after exploring the mountains.", "visual_fact": "Azerbaijan's flag features a central white crescent moon and an eight-pointed star representing the eight Turkic branches.", "tier": 193}, {"code": "BS", "cca3": "BHS", "name": "Bahamas", "capital": "Nassau", "region": "Americas", "subregion": "Caribbean", "flag": "https://flagcdn.com/bs.svg", "mnemonic": "The pirate resting ssels waffles.", "visual_fact": "Belgium's vertical tricolor flag of black, yellow, and red derives its colors from the historic Duchy of Brabant coat of arms.", "tier": 193}, {"code": "BZ", "cca3": "BLZ", "name": "Belize", "capital": "Belmopan", "region": "Americas", "subregion": "Central America", "flag": "https://flagcdn.com/bz.svg", "mnemonic": "To feel at ease in Belize, clean up your mess with a Bell and a Mop (Belmopan).", "visual_fact": "Belize's flag is unique for being the only national flag to feature human figures as a central design element.", "tier": 193}, {"code": "BJ", "cca3": "BEN", "name": "Benin", "capital": "Porto-Novo", "region": "Africa", "subregion": "Western Africa", "flag": "https://flagcdn.com/bj.svg", "mnemonic": "If you have Benin (been in) West Africa long enough, you'll sail straight into Porto-Novo.", "visual_fact": "Benin's flag features a bold vertical green band on the hoist side with horizontal yellow and red bands on the right.", "tier": 193}, {"code": "BM", "cca3": "BMU", "name": "Bermuda", "capital": "Hamilton", "region": "Americas", "subregion": "North America", "flag": "https://flagcdn.com/bm.svg", "mnemonic": "Alexander Hamilton loves wearing Bermuda shorts while visiting Hamilton.", "visual_fact": "Bermuda's flag features a red background with a coat of arms depicting a red lion holding a shield that shows a historic shipwreck.", "tier": 193}, {"code": "BT", "cca3": "BTN", "name": "Bhutan", "capital": "Thimphu", "region": "Asia", "subregion": "Southern Asia", "flag": "https://flagcdn.com/bt.svg", "mnemonic": "You put a Boot-on (Bhutan) to hike up to Thimphu without a single Phew (Thimphu).", "visual_fact": "Bhutan's flag is divided diagonally into yellow and orange sections, featuring Druk the Thunder Dragon holding jewels.", "tier": 193}, {"code": "BO", "cca3": "BOL", "name": "Bolivia", "capital": "Sucre", "region": "Americas", "subregion": "South America", "flag": "https://flagcdn.com/bo.svg", "mnemonic": "A bowl of Bolivia cereal tastes much sweeter when you add some Sucre (sugar).", "visual_fact": "Bolivia's flag consists of three horizontal bands of red, yellow, and green, with its coat of arms prominently displayed in the center.", "tier": 193}, {"code": "BA", "cca3": "BIH", "name": "Bosnia and Herzegovina", "capital": "Sarajevo", "region": "Europe", "subregion": "Southeast Europe", "flag": "https://flagcdn.com/ba.svg", "mnemonic": "The Boss-near (Bosnia) the office told Sara, 'Yeah, go (Sarajevo) home early today!'", "visual_fact": "The flag of Bosnia and Herzegovina features a large yellow triangle representing the country's approximate geographic shape.", "tier": 193}, {"code": "BW", "cca3": "BWA", "name": "Botswana", "capital": "Gaborone", "region": "Africa", "subregion": "Southern Africa", "flag": "https://flagcdn.com/bw.svg", "mnemonic": "In Botswana, the buyer bought one-a (Botswana) car from Gabor-one (Gaborone).", "visual_fact": "Botswana's light blue flag features a central black horizontal stripe bordered by white, symbolizing rain and racial harmony.", "tier": 193}, {"code": "BR", "cca3": "BRA", "name": "Brazil", "capital": "Bras\u00edlia", "region": "Americas", "subregion": "South America", "flag": "https://flagcdn.com/br.svg", "mnemonic": "Finding the capital of Brazil is simple because Bras\u00edlia sounds just like the country itself.", "visual_fact": "Brazil's green flag features a yellow diamond enclosing a blue starry sky with the famous national motto 'Ordem e Progresso'.", "tier": 193}, {"code": "IO", "cca3": "IOT", "name": "British Indian Ocean Territory", "capital": "Diego Garcia", "region": "Africa", "subregion": "Eastern Africa", "flag": "https://flagcdn.com/io.svg", "mnemonic": "In the British Indian Ocean Territory, Don Diego Garcia guards the tropical base.", "visual_fact": "The territory's flag features wavy blue and white water lines alongside a palm tree wearing a royal crown.", "tier": 193}, {"code": "VG", "cca3": "VGB", "name": "British Virgin Isl let selectedTierLimit = 195;
let filteredCountries = [];
let memory = JSON.parse(localStorage.getItem('geo_memory') || '{}');
let currentMode = 'explore';
let currentQuestion = null;
let streak = 0, total = 0, correct = 0;
let svg, g, shapesData = [];

function applyScopeFilter() {
  filteredCountries = allCountries.filter(c => c.tier <= selectedTierLimit);
  updateStats();
  updateMapHighlighting();
}

function onScopeChange(val) {
  selectedTierLimit = parseInt(val, 10);
  applyScopeFilter();
  if (currentMode !== 'explore') {
    nextQuestion();
  }
}

function saveMemory() {
  localStorage.setItem('geo_memory', JSON.stringify(memory));
  updateStats();
}

function updateStats() {
  const activeCodes = new Set(filteredCountries.map(c => c.code));
  const mastered = Object.entries(memory).filter(([code, score]) => activeCodes.has(code) && score >= 3).length;
  document.getElementById('score-streak').innerText = streak;
  document.getElementById('score-mastered').innerText = `${mastered}/${filteredCountries.length}`;
  document.getElementById('score-acc').innerText = total === 0 ? '0%' : Math.round((correct / total) * 100) + '%';
}

async function initMap() {
  const container = document.getElementById('map-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  svg = d3.select("#world-map").attr("viewBox", [0, 0, width, height]);
  const projection = d3.geoNaturalEarth1().scale(width / 5.8).translate([width / 2, height / 1.8]);
  const path = d3.geoPath().projection(projection);
  g = svg.append("g");

  svg.call(d3.zoom().scaleExtent([1, 12]).on("zoom", (e) => g.attr("transform", e.transform)));

  const world = await d3.json("https://unpkg.com/world-atlas@2.0.2/countries-110m.json");
  shapesData = topojson.feature(world, world.objects.countries).features;

  g.selectAll("path")
   .data(shapesData)
   .enter().append("path")
   .attr("class", "country")
   .attr("d", path)
   .attr("id", d => "c-" + d.id)
   .on("click", (e, d) => handleMapSelection(d.id));

  updateMapHighlighting();
}

function updateMapHighlighting() {
  if (!g) return;
  const activeCca3 = new Set(filteredCountries.map(c => c.cca3));
  g.selectAll("path.country")
   .classed("dimmed", d => !activeCca3.has(d.id));
}

function handleMapSelection(id) {
  const c = filteredCountries.find(item => item.cca3 === id || item.name.toLowerCase().includes(id));
  if (currentMode === 'explore') {
    if (c) {
      document.getElementById('explore-flag').src = c.flag;
      document.getElementById('explore-flag').style.display = 'block';
      document.getElementById('explore-name').innerText = c.name;
      document.getElementById('explore-capital').innerText = c.capital;
      document.getElementById('explore-region').innerText = c.subregion;
      
      let tierLabel = "UN Member";
      if (c.tier === 195) tierLabel = "UN Observer State";
      else if (c.tier === 200) tierLabel = "De Facto / Disputed";
      else if (c.tier === 245) tierLabel = "Dependency / Territory";
      document.getElementById('explore-tier').innerText = tierLabel;

      document.getElementById('explore-mnemonic').innerText = c.mnemonic || "None recorded.";
      document.getElementById('explore-fact').innerText = c.visual_fact || "-";
      document.getElementById('explore-info').style.display = 'block';
      document.getElementById('explore-mnemonic-box').style.display = 'block';
    }
  } else if (currentMode === 'map' && currentQuestion) {
    evaluateAnswer(c && c.code === currentQuestion.code);
  }
}

function switchMode(m) {
  currentMode = m;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  if (m === 'explore') {
    document.getElementById('explore-panel').classList.add('active');
    document.getElementById('quiz-panel').classList.remove('active');
  } else {
    document.getElementById('explore-panel').classList.remove('active');
    document.getElementById('quiz-panel').classList.add('active');
    nextQuestion();
  }
}

function pickWeightedTarget() {
  const weights = filteredCountries.map(c => {
    const score = memory[c.code] || 0;
    return score <= 0 ? 4 : (score === 1 ? 2 : 1);
  });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < filteredCountries.length; i++) {
    r -= weights[i];
    if (r <= 0) return filteredCountries[i];
  }
  return filteredCountries[0];
}

function nextQuestion() {
  if (!filteredCountries.length) return;
  currentQuestion = pickWeightedTarget();
  document.getElementById('quiz-hint-box').style.display = 'none';
  document.getElementById('hint-trigger').style.display = 'block';
  document.getElementById('quiz-flag').style.display = 'none';
  const optBox = document.getElementById('quiz-options');
  optBox.innerHTML = '';

  if (currentMode === 'capitals') {
    document.getElementById('quiz-question').innerText = `What is the capital of ${currentQuestion.name}?`;
    makeOptions('capital');
  } else if (currentMode === 'flags') {
    document.getElementById('quiz-flag').src = currentQuestion.flag;
    document.getElementById('quiz-flag').style.display = 'block';
    document.getElementById('quiz-question').innerText = "Which country uses this flag?";
    makeOptions('name');
  } else if (currentMode === 'map') {
    document.getElementById('quiz-question').innerText = `Locate ${currentQuestion.name} on the world map.`;
  }
}

function makeOptions(field) {
  const opts = [currentQuestion[field]];
  while (opts.length < Math.min(4, filteredCountries.length)) {
    const rand = filteredCountries[Math.floor(Math.random() * filteredCountries.length)][field];
    if (!opts.includes(rand)) opts.push(rand);
  }
  opts.sort(() => Math.random() - 0.5).forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = val;
    btn.onclick = () => evaluateAnswer(val === currentQuestion[field]);
    document.getElementById('quiz-options').appendChild(btn);
  });
}

function revealHint() {
  const text = currentQuestion.mnemonic ? currentQuestion.mnemonic : currentQuestion.visual_fact;
  document.getElementById('quiz-hint-text').innerText = text;
  document.getElementById('quiz-hint-box').style.display = 'block';
  document.getElementById('hint-trigger').style.display = 'none';
}

function evaluateAnswer(isCorrect) {
  total++;
  if (isCorrect) {
    correct++;
    streak++;
    memory[currentQuestion.code] = (memory[currentQuestion.code] || 0) + 1;
  } else {
    streak = 0;
    memory[currentQuestion.code] = -1;
  }
  saveMemory();

  if (event && event.target && event.target.tagName === 'BUTTON') {
    event.target.classList.add(isCorrect ? 'correct' : 'wrong');
  }
  setTimeout(nextQuestion, 600);
}

applyScopeFilter();
initMap();
</script>
