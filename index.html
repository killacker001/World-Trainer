<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>World GeoTrainer - Master Countries, Flags & Capitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- D3 and TopoJSON with inline fallback safety -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

<style>
  :root {
    --bg-dark: #07090e;
    --surface-base: #0f1420;
    --surface-card: rgba(22, 30, 48, 0.72);
    --surface-hover: rgba(36, 48, 77, 0.8);
    --border-subtle: rgba(255, 255, 255, 0.09);
    --border-highlight: rgba(56, 189, 248, 0.35);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.28);
    --success: #10b981;
    --success-glow: rgba(16, 185, 129, 0.35);
    --danger: #f43f5e;
    --danger-glow: rgba(244, 63, 94, 0.35);
    --warning: #f59e0b;
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --map-sea: #05070d;
    --map-land: #1c263c;
    --map-stroke: #090d16;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    user-select: none;
  }

  /* Header & Navigation */
  header {
    background: var(--surface-base);
    border-bottom: 1px solid var(--border-subtle);
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    z-index: 30;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .brand-gradient {
    background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .scope-select {
    background: #090e18;
    color: var(--accent);
    border: 1px solid var(--border-subtle);
    padding: 5px 10px;
    border-radius: 18px;
    font-size: 0.74rem;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .scope-select:focus {
    border-color: var(--accent);
  }

  /* Nav Tabs */
  .nav-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 1px;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 18px;
    cursor: pointer;
    font-size: 0.76rem;
    font-weight: 700;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .tab-btn:hover {
    color: var(--text-primary);
    background: rgba(255, 255, 255, 0.08);
  }
  .tab-btn.active {
    background: var(--accent);
    color: #020617;
    border-color: var(--accent);
    box-shadow: 0 0 14px var(--accent-glow);
  }

  /* Workspace Container */
  main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }

  /* Interactive Map Canvas */
  #map-container {
    flex: 1;
    position: relative;
    background: radial-gradient(circle at 50% 50%, #0d1424 0%, #04060b 100%);
    overflow: hidden;
    width: 100%;
    height: 100%;
  }

  svg#map-svg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
  }
  svg#map-svg:active {
    cursor: grabbing;
  }

  /* Vector Country Styling */
  .country-path {
    fill: var(--map-land);
    stroke: var(--map-stroke);
    stroke-width: 0.6px;
    stroke-linejoin: round;
    transition: fill 0.15s ease, opacity 0.2s ease, stroke 0.15s ease;
    cursor: pointer;
  }
  .country-path:hover {
    fill: #0284c7;
    stroke: #38bdf8;
    stroke-width: 1px;
  }
  .country-path.dimmed {
    opacity: 0.16;
    fill: #111724;
    pointer-events: none;
  }
  .country-path.active-selected {
    fill: var(--warning) !important;
    stroke: #fff !important;
    stroke-width: 1.2px;
    filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.5));
  }
  .country-path.correct {
    fill: var(--success) !important;
    stroke: #fff !important;
    stroke-width: 1.2px;
    filter: drop-shadow(0 0 10px var(--success-glow));
  }
  .country-path.wrong {
    fill: var(--danger) !important;
    stroke: #fff !important;
    stroke-width: 1.2px;
    filter: drop-shadow(0 0 10px var(--danger-glow));
  }

  /* Map Controls Overlay (Zoom/Reset) */
  .map-controls {
    position: absolute;
    bottom: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
  }
  .map-ctrl-btn {
    background: rgba(15, 20, 32, 0.85);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.15s;
  }
  .map-ctrl-btn:hover {
    background: var(--surface-hover);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Floating Target Prompt for Find on Map Mode */
  #map-floating-alert {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 20, 35, 0.92);
    border: 1px solid var(--border-highlight);
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 0.84rem;
    font-weight: 700;
    color: #fff;
    display: none;
    z-index: 20;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
  }

  /* Sidebar Panel */
  #sidebar {
    width: 370px;
    background: var(--surface-base);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 25;
  }

  .panel-view {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .panel-view.active {
    display: flex;
  }

  /* Framed Flag Display (Ensures clean full-aspect display) */
  .flag-frame-box {
    width: 100%;
    height: 140px;
    background: #080c14;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    position: relative;
    overflow: hidden;
  }
  .flag-frame-box img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }

  /* Stats Grid */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .stat-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
  }
  .stat-val {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--accent);
  }
  .stat-lbl {
    font-size: 0.62rem;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 2px;
  }

  /* Info Glass Card */
  .glass-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.84rem;
  }
  .info-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  }
  .info-line:last-child {
    border-bottom: none;
  }
  .info-line-label {
    color: var(--text-muted);
    font-size: 0.78rem;
  }
  .info-line-val {
    font-weight: 700;
    color: #fff;
    text-align: right;
  }

  /* Memory Hint Card */
  .mnemonic-card {
    background: rgba(30, 27, 75, 0.6);
    border: 1px solid rgba(99, 102, 241, 0.35);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 0.81rem;
    line-height: 1.45;
    color: #c7d2fe;
    display: none;
  }
  .mnemonic-title {
    color: #e0e7ff;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
    font-weight: 700;
  }

  .hint-toggle-btn {
    background: transparent;
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 700;
    text-align: center;
    transition: all 0.15s ease;
  }
  .hint-toggle-btn:hover {
    background: var(--accent-glow);
  }

  /* Multiple Choice Buttons */
  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .opt-btn {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 0.84rem;
    font-weight: 600;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .opt-btn:hover {
    background: var(--surface-hover);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .opt-btn:active {
    transform: scale(0.985);
  }
  .opt-btn.correct {
    background: var(--success) !important;
    color: #fff !important;
    border-color: var(--success) !important;
    box-shadow: 0 0 14px var(--success-glow);
  }
  .opt-btn.wrong {
    background: var(--danger) !important;
    color: #fff !important;
    border-color: var(--danger) !important;
    box-shadow: 0 0 14px var(--danger-glow);
  }

  /* Empty placeholder state */
  .empty-prompt {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.82rem;
    padding: 30px 14px;
    line-height: 1.5;
  }

  /* Responsive Mobile / Tablet Layout */
  @media (max-width: 840px) {
    main {
      flex-direction: column;
    }
    #map-container {
      height: 48%;
      min-height: 48%;
    }
    #sidebar {
      width: 100%;
      height: 52%;
      border-left: none;
      border-top: 1px solid var(--border-subtle);
      padding: 12px;
    }
    .flag-frame-box {
      height: 110px;
    }
    #map-floating-alert {
      top: 10px;
      font-size: 0.76rem;
      padding: 6px 14px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="brand">
      <span>🌍</span>
      <span class="brand-gradient">GeoTrainer</span>
    </div>
    <select id="scope-selector" class="scope-select" onchange="handleScopeChange(this.value)">
      <option value="193">193: UN Members</option>
      <option value="195" selected>195: Sovereign States</option>
      <option value="200">200: De Facto</option>
      <option value="245">All World Entities</option>
    </select>
  </div>
  <nav class="nav-tabs">
    <button id="btn-explore" class="tab-btn active" onclick="switchMode('explore')">🧭 Explore</button>
    <button id="btn-capitals" class="tab-btn" onclick="switchMode('capitals')">🏛️ Capitals</button>
    <button id="btn-flags" class="tab-btn" onclick="switchMode('flags')">🏳️ Flags</button>
    <button id="btn-map" class="tab-btn" onclick="switchMode('map')">🗺️ Find on Map</button>
  </nav>
</header>

<main>
  <div id="map-container">
    <div id="map-floating-alert">📍 Locate country on the map</div>
    <svg id="map-svg">
      <g id="map-viewport"></g>
    </svg>
    <div class="map-controls">
      <button class="map-ctrl-btn" onclick="zoomMap(1.4)" title="Zoom In">+</button>
      <button class="map-ctrl-btn" onclick="zoomMap(0.7)" title="Zoom Out">−</button>
      <button class="map-ctrl-btn" onclick="resetMapView()" title="Reset View">⟲</button>
    </div>
  </div>

  <aside id="sidebar">
    <!-- Explore Mode Panel -->
    <div id="panel-explore" class="panel-view active">
      <div id="explore-flag-card" class="flag-frame-box" style="display: none;">
        <img id="explore-flag-img" alt="Country Flag" src="" />
      </div>
      <div id="explore-details" class="glass-card" style="display: none;">
        <div class="info-line">
          <span class="info-line-label">Country</span>
          <span class="info-line-val" id="exp-name">-</span>
        </div>
        <div class="info-line">
          <span class="info-line-label">Capital</span>
          <span class="info-line-val" id="exp-capital">-</span>
        </div>
        <div class="info-line">
          <span class="info-line-label">Region</span>
          <span class="info-line-val" id="exp-region">-</span>
        </div>
        <div class="info-line">
          <span class="info-line-label">Status</span>
          <span class="info-line-val" id="exp-status">-</span>
        </div>
      </div>
      <div id="explore-mnemonic-box" class="mnemonic-card">
        <div class="mnemonic-title">🧠 Memory Anchor</div>
        <div id="exp-mnemonic">-</div>
      </div>
      <div id="explore-placeholder" class="empty-prompt">
        Tap or click any illuminated territory on the globe to examine its national flag, capital, status, and memory anchor.
      </div>
    </div>

    <!-- Quiz Panel (Capitals, Flags, Find on Map) -->
    <div id="panel-quiz" class="panel-view">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val" id="score-streak">0</div>
          <div class="stat-lbl">Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="score-mastered">0</div>
          <div class="stat-lbl">Mastered</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="score-accuracy">0%</div>
          <div class="stat-lbl">Accuracy</div>
        </div>
      </div>

      <div id="quiz-flag-card" class="flag-frame-box" style="display: none;">
        <img id="quiz-flag-img" alt="Quiz Target Flag" src="" />
      </div>

      <div id="quiz-question-text" style="font-size: 0.94rem; font-weight: 700; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center;">
        Question text
      </div>

      <div id="quiz-options-container" class="options-grid"></div>

      <button id="quiz-hint-btn" class="hint-toggle-btn" onclick="revealQuizHint()">💡 Need a Memory Hint?</button>
      <div id="quiz-hint-card" class="mnemonic-card">
        <div class="mnemonic-title">💡 Mnemonic Clue</div>
        <div id="quiz-hint-text">-</div>
      </div>
    </div>
  </aside>
</main>

const COUNTRY_CODE_MAP = new Map();
COUNTRIES_MASTER.forEach(c => {
  COUNTRY_NUM_MAP.set(c.num, c);
  COUNTRY_CODE_MAP.set(c.id, c);
});

/* Application State */
let currentMode = 'explore';
let currentTierLimit = 195;
let filteredList = [];
let currentQuizTarget = null;
let streak = 0, totalAnswered = 0, totalCorrect = 0;
let userMemory = JSON.parse(localStorage.getItem('geo_trainer_memory') || '{}');

/* SVG Map Engine Variables */
let svg, g, zoomBehavior;
let currentZoomTransform = d3.zoomIdentity;

<script>
async function initializeMap() {
  const container = document.getElementById('map-container');
  const width = container.clientWidth || 960;
  const height = container.clientHeight || 500;

  svg = d3.select("#map-svg")
          .attr("viewBox", [0, 0, width, height]);

  g = d3.select("#map-viewport");

  // Modern natural earth projection
  const projection = d3.geoNaturalEarth1()
                       .scale(width / 5.4)
                       .translate([width / 2, height / 1.82]);

  const pathGenerator = d3.geoPath().projection(projection);

  // Zoom and pan engine
  zoomBehavior = d3.zoom()
                   .scaleExtent([1, 15])
                   .on("zoom", (event) => {
                     currentZoomTransform = event.transform;
                     g.attr("transform", event.transform);
                   });

  svg.call(zoomBehavior);

  // Try loading top-tier world atlas data with instant fallback
  try {
    const worldAtlas = await d3.json("https://unpkg.com/world-atlas@2.0.2/countries-110m.json");
    if (worldAtlas && worldAtlas.objects && worldAtlas.objects.countries) {
      const geoFeatures = topojson.feature(worldAtlas, worldAtlas.objects.countries).features;
      
      g.selectAll("path.country-path")
       .data(geoFeatures)
       .enter()
       .append("path")
       .attr("class", "country-path")
       .attr("d", pathGenerator)
       .attr("id", d => "poly-" + parseInt(d.id, 10))
       .on("click", function(event, d) {
         handleMapCountryClick(parseInt(d.id, 10));
       });
    }
  } catch (err) {
    console.warn("External map loading fallback engaged:", err);
  }

  applyScopeFilter();
  updateStatsDisplay();
}

function zoomMap(factor) {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, factor);
}

function resetMapView() {
  svg.transition().duration(450).call(zoomBehavior.transform, d3.zoomIdentity);
}

function applyScopeFilter() {
  filteredList = COUNTRIES_MASTER.filter(c => c.tier <= currentTierLimit);
  
  // Highlight or dim map polygons
  const activeNumbers = new Set(filteredList.map(c => parseInt(c.num, 10)));
  d3.selectAll("path.country-path")
    .classed("dimmed", function(d) {
      return !activeNumbers.has(parseInt(d.id, 10));
    });

  updateStatsDisplay();
}

function handleScopeChange(val) {
  currentTierLimit = parseInt(val, 10);
  applyScopeFilter();
  if (currentMode !== 'explore') {
    generateNextQuestion();
  }
}
</script>

<script>
function handleMapCountryClick(numId) {
  const country = COUNTRY_NUM_MAP.get(String(numId));
  if (!country || country.tier > currentTierLimit) return;

  if (currentMode === 'explore') {
    // Clear previous selection highlight
    d3.selectAll("path.country-path").classed("active-selected", false);
    const targetPoly = d3.select("#poly-" + numId);
    if (!targetPoly.empty()) targetPoly.classed("active-selected", true);

    // Populate explore card
    document.getElementById('explore-placeholder').style.display = 'none';
    document.getElementById('explore-flag-card').style.display = 'flex';
    document.getElementById('explore-flag-img').src = country.flag;
    document.getElementById('explore-details').style.display = 'block';
    
    document.getElementById('exp-name').innerText = country.name;
    document.getElementById('exp-capital').innerText = country.cap;
    document.getElementById('exp-region').innerText = country.reg;

    let tierLabel = "UN Member";
    if (country.tier === 195) tierLabel = "UN Observer State";
    else if (country.tier === 200) tierLabel = "De Facto State";
    else if (country.tier === 245) tierLabel = "World Territory";
    document.getElementById('exp-status').innerText = tierLabel;

    document.getElementById('explore-mnemonic-box').style.display = 'block';
    document.getElementById('exp-mnemonic').innerText = country.m;
  } 
  else if (currentMode === 'map' && currentQuizTarget) {
    const isCorrect = (country.id === currentQuizTarget.id);
    evaluateQuizResult(isCorrect, 'map', numId);
  }
}

function switchMode(newMode) {
  currentMode = newMode;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('btn-' + newMode).classList.add('active');

  // Reset visual state on map
  d3.selectAll("path.country-path")
    .classed("active-selected", false)
    .classed("correct", false)
    .classed("wrong", false);

  const banner = document.getElementById('map-floating-alert');
  banner.style.display = (newMode === 'map') ? 'block' : 'none';

  if (newMode === 'explore') {
    document.getElementById('panel-explore').classList.add('active');
    document.getElementById('panel-quiz').classList.remove('active');
  } else {
    document.getElementById('panel-explore').classList.remove('active');
    document.getElementById('panel-quiz').classList.add('active');
    generateNextQuestion();
  }
}

/* Leitner Spaced-Repetition Weighted Selector */
function pickWeightedCountry() {
  if (!filteredList.length) return COUNTRIES_MASTER[0];
  const weights = filteredList.map(c => {
    const score = userMemory[c.id] || 0;
    if (score <= 0) return 4;   // Unseen or missed cards appear frequently
    if (score === 1) return 2;  // Familiar
    return 1;                   // Mastered cards appear sparingly
  });

  const totalWeight = weights.reduce((sum, w) => sum + w, 0);
  let randomVal = Math.random() * totalWeight;

  for (let i = 0; i < filteredList.length; i++) {
    randomVal -= weights[i];
    if (randomVal <= 0) return filteredList[i];
  }
  return filteredList[0];
}

function generateNextQuestion() {
  if (!filteredList.length) return;
  currentQuizTarget = pickWeightedCountry();

  // Reset Hint Card
  document.getElementById('quiz-hint-card').style.display = 'none';
  document.getElementById('quiz-hint-btn').style.display = 'block';
  document.getElementById('quiz-flag-card').style.display = 'none';

  const qText = document.getElementById('quiz-question-text');
  const optBox = document.getElementById('quiz-options-container');
  const banner = document.getElementById('map-floating-alert');
  optBox.innerHTML = '';

  if (currentMode === 'capitals') {
    banner.style.display = 'none';
    qText.innerHTML = `What is the capital of <b style="color:var(--accent); margin-left:4px;">${currentQuizTarget.name}</b>?`;
    renderMultipleChoiceButtons('cap');
  } 
  else if (currentMode === 'flags') {
    banner.style.display = 'none';
    document.getElementById('quiz-flag-card').style.display = 'flex';
    document.getElementById('quiz-flag-img').src = currentQuizTarget.flag;
    qText.innerText = "Which country uses this flag?";
    renderMultipleChoiceButtons('name');
  } 
  else if (currentMode === 'map') {
    banner.style.display = 'block';
    banner.innerHTML = `📍 Find <span style="color:var(--accent);">${currentQuizTarget.name}</span> on the map`;
    qText.innerHTML = `Locate <span style="color:var(--accent); font-weight:800;">${currentQuizTarget.name}</span> on the world map above.`;
    optBox.innerHTML = `
      <div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding:12px 10px; background:rgba(0,0,0,0.2); border-radius:10px;">
        Tap its territory directly on the world map. You can pinch or scroll to zoom.
      </div>
    `;
  }
}

function renderMultipleChoiceButtons(field) {
  const correctVal = currentQuizTarget[field];
  const choices = [correctVal];

  while (choices.length < Math.min(4, filteredList.length)) {
    const randomPick = filteredList[Math.floor(Math.random() * filteredList.length)][field];
    if (!choices.includes(randomPick)) choices.push(randomPick);
  }

  // Shuffle options
  choices.sort(() => Math.random() - 0.5);

  choices.forEach(val => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span>${val}</span><span style="opacity:0.3;">›</span>`;
    btn.onclick = (e) => {
      const isCorrect = (val === correctVal);
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
      evaluateQuizResult(isCorrect, 'button');
    };
    document.getElementById('quiz-options-container').appendChild(btn);
  });
}

function revealQuizHint() {
  if (!currentQuizTarget) return;
  document.getElementById('quiz-hint-text').innerText = `${currentQuizTarget.m} (Region: ${currentQuizTarget.reg})`;
  document.getElementById('quiz-hint-card').style.display = 'block';
  document.getElementById('quiz-hint-btn').style.display = 'none';
}

function evaluateQuizResult(isCorrect, interactionType, targetNum) {
  totalAnswered++;
  if (isCorrect) {
    totalCorrect++;
    streak++;
    userMemory[currentQuizTarget.id] = (userMemory[currentQuizTarget.id] || 0) + 1;
  } else {
    streak = 0;
    userMemory[currentQuizTarget.id] = -1; // Drop back for repetition
  }
  
  localStorage.setItem('geo_trainer_memory', JSON.stringify(userMemory));
  updateStatsDisplay();

  if (interactionType === 'map' && targetNum) {
    const poly = d3.select("#poly-" + targetNum);
    poly.classed(isCorrect ? "correct" : "wrong", true);
    setTimeout(() => {
      poly.classed("correct", false).classed("wrong", false);
      generateNextQuestion();
    }, 750);
  } else {
    setTimeout(generateNextQuestion, 500);
  }
}

function updateStatsDisplay() {
  const activeIds = new Set(filteredList.map(c => c.id));
  const masteredCount = Object.entries(userMemory).filter(([id, score]) => activeIds.has(id) && score >= 3).length;

  document.getElementById('score-streak').innerText = streak;
  document.getElementById('score-mastered').innerText = `${masteredCount}/${filteredList.length}`;
  const acc = (totalAnswered === 0) ? 0 : Math.round((totalCorrect / totalAnswered) * 100);
  document.getElementById('score-accuracy').innerText = `${acc}%`;
}

/* Window Resize Handler */
window.addEventListener('resize', () => {
  const container = document.getElementById('map-container');
  if (svg && container) {
    svg.attr("viewBox", [0, 0, container.clientWidth, container.clientHeight]);
  }
});

/* Bootstrapping */
window.addEventListener('DOMContentLoaded', () => {
  initializeMap();
});
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  initializeMap();
}
</script>
